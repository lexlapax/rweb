<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rweb spike</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
<style>
  :root { --bg: #1e1e1e; --fg: #d4d4d4; --muted: #888; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  #bar { display: flex; gap: 8px; align-items: center; padding: 4px 8px; flex-wrap: wrap; }
  #bar span { color: var(--muted); }
  #term { position: absolute; top: 34px; left: 0; right: 0; bottom: 0; overflow: auto; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="bar">
  <strong>rweb spike</strong>
  <span id="status">connecting</span>
  <span id="mode"></span>
  <button id="fit">Fit to window</button>
  <button id="redraw">Redraw</button>
  <button id="check">Check</button>
</div>
<div id="term"></div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const inputMode = params.get('input') || 'write';   // 'write' or 'key'
const swallow = params.get('swallow') !== '0';      // swallow query sequences
document.getElementById('mode').textContent = `input=${inputMode} swallow=${swallow}`;

const stats = { bytesIn: 0, binMsgs: 0, ctlMsgs: [], sent: [], replyLike: [], connects: 0 };
const term = new Terminal({
  cols: 80, rows: 24, scrollback: 10000, allowProposedApi: true,
  // Key mode stays a hybrid: physical keys go to Rex's client.key; xterm.js
  // still produces mouse reports, pastes and composed text, sent with write.
  fontFamily: 'monospace', fontSize: 14,
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));

if (swallow) {
  // Rex's own terminal answers programs' queries; the browser view must not.
  const csi = [{final:'c'},{prefix:'>',final:'c'},{prefix:'=',final:'c'},{final:'n'},{prefix:'?',final:'n'},
               {intermediates:'$',final:'p'},{prefix:'?',intermediates:'$',final:'p'},{prefix:'>',final:'q'},
               {final:'t'},{prefix:'?',final:'u'}];
  for (const id of csi) term.parser.registerCsiHandler(id, () => true);
  term.parser.registerDcsHandler({intermediates:'$', final:'q'}, () => true);
  for (const n of [4, 10, 11, 12]) term.parser.registerOscHandler(n, data => data.includes('?'));
}

let ws;
function send(obj) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(obj)); stats.sent.push(obj.t); } }

function connect() {
  stats.connects++;
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?token=${token}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { document.getElementById('status').textContent = 'connected'; };
  ws.onclose = () => {
    document.getElementById('status').textContent = 'disconnected, retrying';
    setTimeout(connect, 1000);
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      stats.ctlMsgs.push(m.t);
      if (m.t === 'size') term.resize(m.cols, m.rows);
      else if (m.t === 'theme') applyTheme(m.theme);
      else if (m.t === 'exited') document.getElementById('status').textContent = 'program exited';
      return;
    }
    const bytes = new Uint8Array(ev.data);
    stats.bytesIn += bytes.length; stats.binMsgs++;
    term.write(bytes);
  };
}

function hex(c) { return c && !c.startsWith('#') ? '#' + c : c; }
function applyTheme(t) {
  const theme = {};
  if (t.foreground) theme.foreground = hex(t.foreground);
  if (t.background) { theme.background = hex(t.background); document.body.style.background = theme.background; }
  if (t.cursor) theme.cursor = hex(t.cursor);
  term.options.theme = theme;
}

const replyRe = /^\x1b(\[[?>=]?[\d;]*[cnRtuy]|P|\][0-9]+;)/;
// Input diagnostics for the phone test: every keyboard, input and composition
// event on xterm.js's textarea, and what xterm.js turned them into.
const debugInput = params.get('dbg') !== '0';
const dbg = o => { if (debugInput) send({t: 'dbg', ms: Math.round(performance.now()), ...o}); };
if (debugInput) {
  const ta = term.textarea;
  for (const ev of ['keydown', 'keyup'])
    ta.addEventListener(ev, e => dbg({ev, key: e.key, code: e.code, kc: e.keyCode, comp: e.isComposing}), true);
  for (const ev of ['beforeinput', 'input'])
    ta.addEventListener(ev, e => dbg({ev, it: e.inputType, data: e.data, comp: e.isComposing}), true);
  for (const ev of ['compositionstart', 'compositionupdate', 'compositionend'])
    ta.addEventListener(ev, e => dbg({ev, data: e.data}), true);
}
term.onData(d => {
  dbg({ev: 'onData', d});
  if (replyRe.test(d)) stats.replyLike.push(JSON.stringify(d));
  send({t: 'in', d});
});
term.onBinary(d => send({t: 'in', d}));
if (inputMode === 'key') {
  // Physical keys go to Rex, which encodes them for the program's keyboard mode.
  const MODS = ['shift', 'ctrl', 'alt', 'super'];
  const snake = code => code.replace(/([a-z0-9])([A-Z])/g, '$1_$2').replace(/([A-Za-z])([0-9])/g, '$1_$2').toLowerCase();
  term.attachCustomKeyEventHandler(e => {
    if (e.type !== 'keydown' && e.type !== 'keyup') return false;
    // No usable physical key (input method, phone keyboard): let xterm.js turn
    // the text into input, which goes out through write.
    if (e.isComposing || e.keyCode === 229 || e.key === 'Unidentified' || !e.code) return true;
    // Let the browser's own paste shortcut through to xterm.js.
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v' && e.shiftKey) return true;
    const mods = [e.shiftKey && 'shift', e.ctrlKey && 'ctrl', e.altKey && 'alt', e.metaKey && 'super'].filter(Boolean).join('+');
    const text = (e.key.length === 1 && !e.ctrlKey && !e.metaKey) ? e.key : '';
    const base = e.key.length === 1 ? e.key.toLowerCase().codePointAt(0) : 0;
    send({t: 'key', key: {
      key: snake(e.code || 'Unidentified'), mods,
      consumed_mods: (text && e.shiftKey) ? 'shift' : '', text,
      unshifted_codepoint: base, composing: false,
      action: e.type === 'keyup' ? 'release' : (e.repeat ? 'repeat' : 'press'),
    }});
    e.preventDefault();
    return false;
  });
}

document.getElementById('fit').onclick = () => {
  const d = fit.proposeDimensions();
  if (d) send({t: 'fit', cols: d.cols, rows: d.rows});
};
document.getElementById('redraw').onclick = () => send({t: 'redraw'});
document.getElementById('check').onclick = () => { window.rweb.dump(); dbg({ev: 'check'}); term.focus(); };

// Test hooks: read what the browser terminal shows.
window.rweb = {
  term, stats,
  lines() {
    const b = term.buffer.active, out = [];
    for (let i = 0; i < b.length; i++) out.push(b.getLine(i).translateToString(true));
    while (out.length && out[out.length - 1] === '') out.pop();
    return out;
  },
  screen() {
    const b = term.buffer.active, out = [];
    for (let i = 0; i < term.rows; i++) out.push(b.getLine(b.viewportY + i).translateToString(true));
    return out;
  },
  drop() { ws.close(); },
  dump() { send({t: 'dump', rows: this.screen()}); },
  setTheme(background, foreground) { send({t: 'settheme', background, foreground}); },
};
connect();
term.focus();
</script>
</body>
</html>
