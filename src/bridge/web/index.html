<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#111418" id="theme-color">
<title>rweb</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="bar">
  <button id="menu" class="icon" aria-label="Sessions and terminals" aria-controls="list" aria-expanded="true">&#9776;</button>
  <div id="crumb" aria-live="polite"><div id="crumb-main"><span id="crumb-session"></span><span id="crumb-sep" aria-hidden="true"> &rsaquo; </span><span id="crumb-term"></span><span id="crumb-count" class="dim"></span></div><div id="crumb-sub" class="dim"></div></div>
  <button id="tabsel" hidden aria-haspopup="menu" aria-expanded="false" aria-label="Switch terminal"></button>
  <span class="spacer"></span>
  <span id="dot" class="dot" role="status" aria-label="connecting" title="connecting"></span>
  <button id="more" class="icon" aria-label="More" aria-haspopup="menu" aria-expanded="false">&#8943;</button>
</header>
<div id="tabrow" hidden><nav id="tabs" aria-label="Terminals in this session"></nav><span id="ports" aria-label="Listening ports"></span><button id="tab-menu" aria-label="This terminal" aria-haspopup="menu" aria-expanded="false" title="This terminal">&#8943;</button><button id="tab-add" aria-label="New terminal in this session" title="New terminal">+</button></div>
<div id="banner" hidden role="status"></div>
<main>
  <nav id="list" aria-label="Sessions and terminals" class="open">
    <div class="row"><button id="new-session">New session</button></div>
    <div id="tree"></div>
  </nav>
  <div id="scrim"></div>
  <section id="view">
    <div id="empty" class="dim">Pick a terminal from the list.</div>
    <div id="stage" hidden><div id="term"></div></div>
    <div id="keys" hidden aria-label="Extra keys">
      <div id="keys-more" hidden></div>
      <div id="keys-main"></div>
    </div>
  </section>
</main>

<div id="pop" class="pop" role="menu" hidden></div>
<div id="notice" role="status" aria-live="polite" hidden></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" id="dlg-form">
    <h2 id="dlg-title"></h2>
    <p id="dlg-msg" class="dim"></p>
    <label id="dlg-label" for="dlg-input"></label>
    <input id="dlg-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128">
    <div class="buttons">
      <button type="button" id="dlg-cancel">Cancel</button>
      <button type="submit" id="dlg-ok" value="ok">OK</button>
    </div>
  </form>
</dialog>

<dialog id="copydlg" aria-labelledby="copy-title">
  <div class="copy-head">
    <h2 id="copy-title">Copy text</h2>
    <span id="copy-note" class="dim"></span>
    <span class="spacer"></span>
    <button id="copy-close">Close</button>
  </div>
  <div class="copy-actions">
    <button id="copy-all">Copy all</button>
    <button id="copy-last">Copy last 100 lines</button>
    <button id="copy-sel" disabled>Copy selected</button>
    <button id="copy-clear" disabled>Clear</button>
    <button id="copy-native" aria-pressed="false">Use handles</button>
    <button id="copy-share" hidden>Share&hellip;</button>
  </div>
  <p id="copy-help" class="dim">Tap a line to start a selection, then tap another line to select down (or up) to it.</p>
  <div id="copytext" tabindex="-1" role="group" aria-label="Terminal text, one line per row. Tap a line to start a selection."></div>
</dialog>

<dialog id="xferdlg" aria-labelledby="xf-title">
  <div id="xf-head">
    <h2 id="xf-title">Download a file</h2>
    <button id="xf-close" type="button" aria-label="Close">Close</button>
  </div>
  <div id="xf-bar">
    <button id="xf-up" type="button" aria-label="Parent folder" title="Parent folder">&#8593;</button>
    <button id="xf-home" type="button" aria-label="Home folder" title="Home folder">~</button>
    <div id="xf-path" class="dim" aria-live="polite"></div>
  </div>
  <div id="xf-tools">
    <input id="xf-filter" type="search" placeholder="Filter, or type a /path and press Enter" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Filter names">
    <label id="xf-hidden-l"><input id="xf-hidden" type="checkbox"> Hidden</label>
  </div>
  <div id="xf-list" role="list"></div>
  <p id="xf-note" class="dim"></p>
</dialog>
<input id="upfile" type="file" multiple hidden>

<dialog id="pastedlg" aria-labelledby="paste-title">
  <form method="dialog">
    <h2 id="paste-title">Paste</h2>
    <p class="dim">This browser would not let the page read the clipboard. Paste here, then send.</p>
    <textarea id="pastetext" rows="6" spellcheck="false" aria-label="Text to paste"></textarea>
    <div class="buttons">
      <button type="button" id="paste-cancel">Cancel</button>
      <button type="submit" id="paste-send" value="ok">Send</button>
    </div>
  </form>
</dialog>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/keys.js"></script>
<script src="/app.js"></script>
</body>
</html>
